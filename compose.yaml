services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: grand_charter
      POSTGRES_USER: grand_charter
      POSTGRES_PASSWORD: grand_charter
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "grand_charter", "-d", "grand_charter"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
